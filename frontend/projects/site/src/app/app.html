<a class="skiplink" href="#main">{{ ui.skip }}</a>
<fx-particles />
<div class="aurora" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<nav class="top" [class.scrolled]="navVisible()" aria-label="Hauptnavigation">
  <a class="brand" routerLink="/">{{ ui.nav.brand }}</a>
  <div class="links">
    <a routerLink="/" fragment="werdegang">{{ ui.nav.werdegang }}</a>
    <a routerLink="/" fragment="projekte">{{ ui.nav.projekte }}</a>
    <a routerLink="/" fragment="kenntnisse">{{ ui.nav.kenntnisse }}</a>
    <a routerLink="/" fragment="kontakt">{{ ui.nav.kontakt }}</a>
  </div>
</nav>

<div class="wrap">
  <main id="main">
    <router-outlet />
  </main>
  <footer>
    <span>© {{ year }} {{ name }}</span>
    <nav aria-label="Weitere Seiten">
      <a routerLink="/making-of">{{ ui.footer.makingOf }}</a>
      <a routerLink="/datenschutz">{{ ui.footer.privacy }}</a>
      <a href="https://github.com/ce451/my-cv">{{ ui.footer.source }}</a>
    </nav>
  </footer>
</div>
<fx-cursor />
