<a class="skiplink" href="#main">{{ ui.skip }}</a>
<fx-particles />
<div class="aurora" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="wrap">
  <main id="main">
    <router-outlet />
  </main>
  <footer>
    <span>© {{ year }} {{ name }}</span>
    <nav aria-label="Weitere Seiten">
      <a routerLink="/making-of">{{ ui.footer.makingOf }}</a>
      <a routerLink="/datenschutz">{{ ui.footer.privacy }}</a>
      <a href="https://github.com/ce451/my-cv">{{ ui.footer.source }}</a>
    </nav>
  </footer>
</div>

<button
  type="button"
  class="to-top"
  #toTop
  [class.show]="topVisible()"
  (click)="scrollTop()"
  [attr.aria-label]="ui.toTop"
>
  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none"
    stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5" />
    <path d="m5 12 7-7 7 7" />
  </svg>
</button>
<fx-cursor />
