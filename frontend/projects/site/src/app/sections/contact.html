<section class="section contact" id="kontakt">
  <p class="big" fxReveal>{{ ui.contact.lineTop }}<br /><em>{{ ui.contact.lineBottom }}</em></p>
  @if (linkedIn?.url; as linkedInUrl) {
    <span class="rv-d1" fxMagnetic fxReveal>
      <a class="cta" [href]="linkedInUrl">{{ ui.contact.ctaLinkedIn }}</a>
    </span>
  }
  @if (github?.url; as githubUrl) {
    <p class="alt rv-d2" fxReveal>
      {{ ui.contact.or }}
      <a [href]="githubUrl">{{ ui.contact.github }}</a>
    </p>
  }
</section>
