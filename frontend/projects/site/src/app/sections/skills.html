<section class="section" id="kenntnisse">
  <h2 fxReveal><span class="no">03</span>{{ ui.sections.kenntnisse }}</h2>
  <div class="skills">
    @for (group of skills; track group.category) {
      <div class="row" fxReveal>
        <div class="cat">{{ group.category }}</div>
        <ul class="chips">
          @for (item of group.items; track item) {
            <li>{{ item }}</li>
          }
        </ul>
      </div>
    }
  </div>
</section>
