<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Seite nicht gefunden · Christopher Elstner</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0c0b">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- static page: with it, Cloudflare Pages answers unknown paths with a real 404 instead of the start page -->
<style>
  @font-face { font-family: 'Archivo'; src: url('/fonts/archivo-latin-wdth-normal.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  @font-face { font-family: 'Hanken Grotesk'; src: url('/fonts/hanken-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box;
    background: radial-gradient(ellipse 80% 70% at 50% 45%, #1b1815 0%, #0d0c0b 100%); color: #ede6dc; text-align: center;
    font-family: 'Hanken Grotesk', system-ui, sans-serif; }
  .code { margin: 0; color: #c9814f; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.3em; }
  h1 { margin: 0.7rem 0 1rem; font-family: 'Archivo', system-ui, sans-serif; font-stretch: 125%; font-weight: 800;
    font-size: clamp(1.8rem, 6vw, 3.2rem); line-height: 1; letter-spacing: -0.012em; }
  p { margin: 0 0 2rem; color: #a69c8f; }
  a { color: #ede6dc; text-decoration: none; border-bottom: 1px solid #c9814f; padding-bottom: 2px; }
  a:hover, a:focus-visible { color: #c9814f; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Diese Seite gibt es nicht.</h1>
  <p>Der Lebenslauf ist eine Adresse weiter.</p>
  <a href="/">Zur Startseite</a>
</main>
</body>
</html>
