<!doctype html>
<!-- the link preview (og-image.png, 1200x630), rendered by brand.sh in headless Chrome -->
<html lang="de"><head><meta charset="utf-8"><style>
  @font-face { font-family: 'Archivo'; src: url('../../public/fonts/archivo-latin-wdth-normal.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: 'Hanken Grotesk'; src: url('../../public/fonts/hanken-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; color: #ede6dc; font-family: 'Hanken Grotesk', sans-serif;

  .text { position: absolute; left: 84px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .role { margin: 0 0 26px; color: #c9814f; font-weight: 600; font-size: 21px; letter-spacing: 0.2em; text-transform: uppercase; }
  h1 { margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 88px; line-height: 0.92; letter-spacing: -0.012em; }
  .where { margin: 34px 0 0; color: #a69c8f; font-size: 25px; }
  .where b { color: #ede6dc; font-weight: 500; }
  .photo { position: absolute; right: 92px; top: 50%; width: 330px; height: 330px; margin-top: -165px; border-radius: 50%;
    box-shadow: 0 0 0 3px #c9814f, 0 0 0 14px #141210, 0 0 0 15px #3a332b, 0 30px 80px rgb(0 0 0 / 0.55); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style></head>
<body>
  <div class="text">
    <p class="role">Digitalisierungsbeauftragter</p>
    <h1>Christopher<br>Elstner</h1>
