name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build content-model
      - run: npx ng build site
      - run: node tools/verify-csp.mjs
      - run: npx ng build studio
      - run: npm run test:ci

  # the scroll story (web/), the successor of frontend/: build and CSP check
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node tools/verify-csp.mjs

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  # Which site goes live: the repository variable SITE (Settings > Secrets and variables >
  # Actions > Variables). Unset: frontend/ as before; SITE=web: the scroll story (deploy-web).
  deploy:
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && vars.SITE != 'web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx ng build content-model
        working-directory: frontend
      - run: npx ng build site
        working-directory: frontend
      - run: node tools/verify-csp.mjs
        working-directory: frontend
      # Idempotent: legt das Projekt beim ersten Lauf an, scheitert danach folgenlos.
      - name: Ensure Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create elstner-cv --production-branch=main
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist/site/browser --project-name=elstner-cv

  deploy-web:
    needs: [web]
    if: github.ref == 'refs/heads/main' && vars.SITE == 'web'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: node tools/verify-csp.mjs
        working-directory: web
      # the rendered frames are part of the page (without them the story shows no laptop),
      # v1/ is the frozen first version (web/tools/v1/build.sh)
      - name: Frames and v1 present
        run: test -f web/dist/seq/meta.json && test -f web/dist/seq-portrait/meta.json && test -f web/dist/v1/index.html
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/dist --project-name=elstner-cv
